<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nvim-lookup</title>

    <!-- CodeMirror CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/monokai.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/solarized.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/base16-light.min.css">

    <style>
        :root {
            --bg: #ffffff;
            --fg: #1a1a1a;
            --border: #e5e7eb;
            --accent: #2563eb;
            --highlight-bg: #fef3c7;
            --highlight-border: #f59e0b;
            --panel-bg: #f9fafb;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: var(--bg);
        }

        #toolbar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            background: white;
        }

        #toolbar button {
            padding: 8px 16px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: white;
            cursor: pointer;
            font-size: 14px;
        }

        #toolbar button:hover {
            background: var(--panel-bg);
        }

        #toolbar button.translate-btn {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        #toolbar button.translate-btn:hover {
            background: #1d4ed8;
        }

        #filename {
            flex: 1;
            color: #6b7280;
            font-size: 14px;
        }

        #vim-mode {
            color: #6b7280;
            font-family: monospace;
            font-size: 13px;
        }

        #main-container {
            display: grid;
            grid-template-columns: 65% 35%;
            flex: 1;
            overflow: hidden;
        }

        #editor-pane {
            border-right: 1px solid var(--border);
            overflow: hidden;
            position: relative;
        }

        #editor-pane.drag-over {
            background: #eff6ff;
            outline: 2px dashed var(--accent);
            outline-offset: -10px;
        }

        .CodeMirror {
            height: 100%;
            font-size: 15px;
            font-family: 'SF Mono', Monaco, 'Cascadia Code', monospace;
            line-height: 1.6;
        }

        .highlight-mark {
            background: rgba(245, 158, 11, 0.2) !important;
            border-bottom: 2px solid rgba(245, 158, 11, 0.8) !important;
            box-shadow: 0 0 0 1px rgba(245, 158, 11, 0.3);
        }

        /* Better highlights for dark themes */
        .cm-s-monokai .highlight-mark,
        .cm-s-dracula .highlight-mark,
        .cm-s-material .highlight-mark,
        .cm-s-solarized.cm-s-dark .highlight-mark {
            background: rgba(255, 215, 0, 0.25) !important;
            border-bottom: 2px solid rgba(255, 215, 0, 0.9) !important;
            box-shadow: 0 0 0 1px rgba(255, 215, 0, 0.4);
        }

        #chat-pane {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--panel-bg);
        }

        #chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            padding: 16px;
            border-radius: 8px;
            background: white;
            border: 1px solid var(--border);
        }

        .message.translation {
            border-left: 4px solid var(--accent);
        }

        .message.question {
            background: #eff6ff;
            border-left: 4px solid #3b82f6;
        }

        .message h3 {
            font-size: 18px;
            margin-bottom: 8px;
            color: var(--fg);
        }

        .message .translation-text {
            font-size: 16px;
            color: #059669;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .message .explanations {
            color: #4b5563;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        #chat-input-container {
            padding: 16px;
            border-top: 1px solid var(--border);
            background: white;
        }

        #chat-input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
        }

        #chat-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .empty-state {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #9ca3af;
            font-size: 14px;
            text-align: center;
            padding: 20px;
        }

        .help-text {
            margin-top: 10px;
            font-size: 12px;
            color: #9ca3af;
        }

        .context-actions {
            margin-top: 16px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .context-btn {
            padding: 8px 16px;
            border: 1px solid var(--accent);
            border-radius: 6px;
            background: white;
            color: var(--accent);
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
        }

        .context-btn:hover {
            background: var(--accent);
            color: white;
        }

        .context-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div id="toolbar">
        <button id="open-file">Open File</button>
        <button id="translate-btn" class="translate-btn">Translate Selection</button>
        <select id="theme-select" style="padding: 6px; border-radius: 4px; border: 1px solid #e5e7eb;">
            <option value="default">Default</option>
            <option value="monokai">Monokai</option>
            <option value="dracula">Dracula</option>
            <option value="solarized dark">Solarized Dark</option>
            <option value="solarized light">Solarized Light</option>
            <option value="material">Material</option>
            <option value="base16-light">Base16 Light</option>
        </select>
        <button id="settings">Settings</button>
        <span id="filename"></span>
        <span id="vim-mode">-- NORMAL --</span>
    </div>

    <div id="main-container">
        <div id="editor-pane">
            <textarea id="editor"></textarea>
        </div>

        <div id="chat-pane">
            <div id="chat-messages">
                <div class="empty-state">
                    <div>
                        <div>Select text and click "Translate Selection" button</div>
                        <div class="help-text">Or use vim: press <code>v</code> to select, then type <code>:t</code> or <code>:tr</code></div>
                    </div>
                </div>
            </div>
            <div id="chat-input-container">
                <input
                    type="text"
                    id="chat-input"
                    placeholder="Ask a follow-up question..."
                    disabled
                />
            </div>
        </div>
    </div>

    <!-- CodeMirror and dependencies -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/markdown/markdown.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/keymap/vim.min.js"></script>

    <!-- Context extraction (must load before app.js) -->
    <script src="/static/context-extractor.js"></script>
    <script src="/static/app.js"></script>
</body>
</html>
